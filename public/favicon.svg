<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Navy background -->
  <rect width="32" height="32" rx="4" fill="#1A3A6A"/>
  <!-- Milk glass body (trapezoid) -->
  <path d="M10 8 L11.5 24 L20.5 24 L22 8 Z" fill="white" opacity="0.95"/>
  <!-- Milk fill inside glass -->
  <path d="M11.8 13 L12.8 24 L19.2 24 L20.2 13 Z" fill="#4488CC" opacity="0.6"/>
  <!-- Glass rim -->
  <rect x="10" y="7" width="12" height="2.5" rx="1" fill="white"/>
  <!-- Glass base -->
  <rect x="11" y="23" width="10" height="2" rx="1" fill="white"/>
  <!-- Shine highlight -->
  <path d="M12.5 11 L12 21" stroke="white" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
</svg>
